name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "dm/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - android
      - "feature/**"
    paths:
      - "android/**"
      - "dm/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 Android APK
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK and CMake
        shell: bash
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install native build tools
        run: brew install ninja

      - name: Build the on-device packer stage
        shell: zsh {0}
        run: |
          zsh android/ondevice/build.sh "$RUNNER_TEMP/nxnative-pack"

      - name: Configure Android SDK path
        run: |
          printf 'sdk.dir=%s\\n' "$ANDROID_SDK_ROOT" > android/app/local.properties

      - name: Configure APK signing (persistent key if supplied)
        shell: bash
        env:
          NX_KEYSTORE_BASE64: ${{ secrets.NX_KEYSTORE_BASE64 }}
          NX_KEY_ALIAS: ${{ secrets.NX_KEY_ALIAS }}
          NX_KEY_PASSWORD: ${{ secrets.NX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NX_KEYSTORE_BASE64" && -z "$NX_KEY_ALIAS" && -z "$NX_KEY_PASSWORD" ]]; then
            echo "::notice::No persistent signing key configured; using the temporary Android debug key. Future APKs may require reinstalling."
            exit 0
          fi
          if [[ -z "$NX_KEYSTORE_BASE64" || -z "$NX_KEY_ALIAS" || -z "$NX_KEY_PASSWORD" ]]; then
            echo "::error::If using a persistent key, provide all three NX_KEYSTORE_BASE64, NX_KEY_ALIAS and NX_KEY_PASSWORD secrets."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/banana-native-ui.jks"
          printf '%s' "$NX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          {
            echo "NX_SIGN_STORE=$KEYSTORE"
            echo "NX_SIGN_ALIAS=$NX_KEY_ALIAS"
            echo "NX_SIGN_PASS=$NX_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PnxPlay=true -PnxPlayId=dev.nxnative.android.play.ui -PnxLabel='Banana Native ui' -PnxPackStage="$RUNNER_TEMP/nxnative-pack/stage" apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Banana-Native-Android-arm64
          path: android/app/out/*.apk
          if-no-files-found: error
          retention-days: 14
